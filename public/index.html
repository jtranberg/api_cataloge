<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>S&S Product Catalog</title>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>

  <body>
    <!-- Mobile Category Toggle -->
    <button class="menu-toggle" onclick="toggleSidebar()">☰ Categories</button>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
      <h1>Categories</h1>

      <!-- Category Spinner -->
      <div
        id="category-spinner"
        class="spinner-wrapper"
        style="display: none; padding: 10px 0"
      >
        <div class="loader" style="margin: auto"></div>
      </div>

      <!-- Category List -->
      <div class="category-list" id="category-list"></div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <p class="catalog-eyebrow">Supplier Catalog</p>
<h1 class="catalog-title">Brands Available</h1>
<p class="catalog-subtitle">
  Browse trusted apparel suppliers and select a brand to explore available products.
</p>

      <!-- Brand Grid -->
      <div class="grid-container" id="brand-list">Loading brands...</div>

      <!-- Product Loading Spinner -->
      <div id="spinner" class="spinner-wrapper">
        <div class="loader"></div>
        <p id="loading-message"></p>
      </div>

      <!-- Products from Selected Brand or Category -->
      <h2 id="brand-title"></h2>
      <div class="grid-container" id="product-list"></div>
    </div>

    <!-- Product Details Modal -->
    <div id="product-modal" class="modal">
      <div class="modal-content">
        <span class="close-button" onclick="closeModal()">&times;</span>

        <div class="modal-layout">
          <!-- Left: Product Images -->
          <div class="modal-image-container">
            <div class="image-layout">
              <div class="thumbnail-column" id="thumbnail-column"></div>

              <div class="main-image-frame">
                <img id="modal-image" src="" alt="Product Image" />
              </div>
            </div>
          </div>

          <!-- Right: Product Info -->
          <div class="modal-details">
            <h2 id="modal-title"></h2>

            <p>
              <strong>Brand:</strong>
              <span id="modal-brand"></span>
            </p>

            <p>
              <strong>SKU:</strong>
              <span id="modal-sku">Select size & color</span>
            </p>

            <p><strong>Colors:</strong></p>
            <div class="color-palette" id="color-options"></div>

            <p><strong>Sizes:</strong></p>
            <div id="modal-sizes" class="product-sizes"></div>

            <p>
              <strong>Price:</strong>
              $<span id="modal-price"></span>
            </p>
          </div>
        </div>

        <!-- Product Description -->
        <p id="modal-description" class="product-description"></p>
      </div>
    </div>

    <!-- Back to Blackshirt Homepage -->
    <a
  href="https://blktshirt.lovable.app"
  id="backToHomeBtn"
>
  ← Back to Home
</a>
      ← Back to Home
    </a>

    <script src="script.js" defer></script>
  </body>
</html>
