<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BLK-T Shirt Co. — Products</title>

  <link rel="icon" type="image/svg" href="/favicon.svg" />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="products-page">
  <h1 id="brand-title">Loading Products...</h1>

  <p class="products-subtitle">
    BLK-T Shirt Co. — Product Catalog. World class brands, wholesale pricing, and customization options available.
  </p>

  <div class="grid-container" id="product-list">Loading...</div>

  <a href="index.html" class="back-link">← Back to Catalog</a>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const urlParams = new URLSearchParams(window.location.search);
      const brandId = urlParams.get("brandId");
      const brandName = urlParams.get("brandName");

      if (!brandId) {
        document.getElementById("product-list").innerHTML = "<p>Brand not found.</p>";
        return;
      }

      document.getElementById("brand-title").textContent = `Products from ${brandName || "Selected Brand"}`;

      try {
        const response = await fetch(`https://sands-cataloge-api.onrender.com/products/${brandId}`);

        if (!response.ok) {
          throw new Error(`Failed to fetch products. Status: ${response.status}`);
        }

        const data = await response.json();
        const productList = document.getElementById("product-list");

        if (!data.products || data.products.length === 0) {
          productList.innerHTML = `<p>No products found for this brand.</p>`;
          return;
        }

        productList.innerHTML = data.products.map(product => `
          <div class="product-page-card">
            <div class="item-title">
              <strong>${product.brandName || ""}</strong><br>
              ${product.styleName || ""}
            </div>

            ${
              product.colorFrontImage
                ? `<img src="https://www.ssactivewear.com/${product.colorFrontImage}" class="item-image" alt="${product.styleName || "Product"}">`
                : ""
            }

            <p class="item-meta">SKU: ${product.sku || "N/A"}</p>
            <p class="item-meta">Color: ${product.colorName || "N/A"}</p>
            <p class="item-meta">Size: ${product.sizeName || "N/A"}</p>
            <p class="item-meta">Price: $${product.piecePrice || "N/A"}</p>
          </div>
        `).join("");

      } catch (error) {
        console.error("❌ Error fetching products:", error);
        document.getElementById("product-list").innerHTML = "<p>Failed to load products.</p>";
      }
    });
  </script>
</body>
</html>
